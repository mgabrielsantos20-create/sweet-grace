<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagamento · Sweet Grace</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<meta name="theme-color" content="#FBEFE1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --creme: #FBEFE1; --creme-2: #F3E6D5; --papel: #FFFBF5; --ouro: #B0843A; --ouro-escuro: #8A6528; --cacau: #4B3526; --cacau-suave: #7A6252; --linha: #E4D3BC; --ok: #4F6B43; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--creme); color: var(--cacau); font: 400 16px/1.55 "Jost", system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .caixa { width: min(440px, 100%); background: var(--papel); border: 1px solid var(--linha); border-radius: 18px; padding: 24px 20px; display: grid; gap: 16px; text-align: center; }
  .logo { width: 88px; height: 88px; object-fit: cover; border-radius: 50%; margin: 0 auto; }
  h1 { font: 500 30px/1.1 "Cormorant Garamond", Georgia, serif; margin: 0; }
  p { margin: 0; color: var(--cacau-suave); }
  .valor { font: 500 44px/1 "Cormorant Garamond", Georgia, serif; color: var(--cacau); }
  .opcoes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .opcao { border: 1px solid var(--linha); background: var(--papel); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--cacau-suave); cursor: pointer; }
  .opcao[aria-pressed="true"] { border-color: var(--ouro); background: var(--creme-2); color: var(--cacau); }
  .qr { width: min(260px, 80vw); margin: 0 auto; background: #fff; border-radius: 12px; padding: 6px; }
  .qr svg { display: block; width: 100%; height: auto; }
  .copia { display: grid; gap: 8px; }
  .copia textarea { width: 100%; font: 12px/1.4 ui-monospace, monospace; padding: 10px; border: 1px solid var(--linha); border-radius: 10px; background: #fff; color: var(--cacau); resize: none; height: 72px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; font: 500 14px/1 "Jost", sans-serif; letter-spacing: .1em; text-transform: uppercase; border: 0; border-radius: 999px; padding: 15px 22px; background: var(--ouro); color: var(--papel); cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--ouro-escuro); }
  .btn.contorno { background: transparent; color: var(--ouro-escuro); box-shadow: inset 0 0 0 1.5px var(--ouro); }
  .linhas { display: grid; gap: 4px; font-size: 15px; text-align: left; border-top: 1px solid var(--linha); padding-top: 12px; }
  .linhas div { display: flex; justify-content: space-between; gap: 10px; }
  .pago { color: var(--ok); font-weight: 500; }
  .passos { text-align: left; font-size: 14px; color: var(--cacau-suave); margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<main class="caixa" id="caixa">
  <img class="logo" src="assets/logo.jpeg" alt="Sweet Grace">
  <p id="carregando">Carregando o pedido...</p>
  <div id="conteudo" hidden style="display:grid;gap:16px">
    <h1 id="titulo">Pedido</h1>
    <div class="opcoes" id="opcoes" role="group" aria-label="O que pagar">
      <button class="opcao" type="button" data-tipo="sinal" aria-pressed="true">Sinal (50%)</button>
      <button class="opcao" type="button" data-tipo="total" aria-pressed="false">Valor total</button>
    </div>
    <div>
      <p id="rotulo-valor">Valor do sinal</p>
      <div class="valor" id="valor"></div>
    </div>
    <div class="qr" id="qr" role="img" aria-label="QR Code do Pix"></div>
    <div class="copia">
      <p>Ou use o Pix copia e cola:</p>
      <textarea id="copia" readonly aria-label="Código Pix copia e cola"></textarea>
      <button class="btn" type="button" id="copiar">Copiar código Pix</button>
    </div>
    <ol class="passos">
      <li>Abra o app do seu banco e escolha Pix.</li>
      <li>Leia o QR Code ou cole o código.</li>
      <li>Confira o valor e o nome e pague.</li>
      <li>Mande o comprovante pelo WhatsApp.</li>
    </ol>
    <a class="btn contorno" id="zap" target="_blank" rel="noopener">Enviar comprovante</a>
    <div class="linhas" id="linhas"></div>
  </div>
  <div id="mensagem" hidden style="display:grid;gap:16px">
    <h1 id="msg-titulo"></h1>
    <p id="msg-texto"></p>
    <a class="btn contorno" href="./">Ver o site</a>
  </div>
</main>
<script src="config-supabase.js"></script>
<script src="vendor/qrcode-generator-2.0.4.js"></script>
<script src="pix.js"></script>
<script>
(async function () {
  const WHATSAPP = "5591985614644";
  const cfg = window.SWEET_GRACE_SUPABASE || {};
  const codigo = (new URLSearchParams(location.search).get("pedido") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  const $ = (id) => document.getElementById(id);
  const brl = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const aviso = (titulo, texto) => { $("carregando").hidden = true; $("conteudo").hidden = true; $("msg-titulo").textContent = titulo; $("msg-texto").textContent = texto; $("mensagem").hidden = false; };

  if (!codigo || !cfg.url) return aviso("Link incompleto", "Peça um novo link de pagamento pelo WhatsApp.");
  const cab = { apikey: cfg.chave, Authorization: "Bearer " + cfg.chave, "Content-Type": "application/json" };
  let pedido, conf;
  try {
    const [r1, r2] = await Promise.all([
      fetch(cfg.url + "/rest/v1/rpc/dados_pagamento", { method: "POST", headers: cab, body: JSON.stringify({ p_codigo: codigo }) }),
      fetch(cfg.url + "/rest/v1/config?select=pix_chave,pix_nome,pix_cidade&id=eq.1", { headers: cab })
    ]);
    if (!r1.ok || !r2.ok) throw new Error();
    pedido = await r1.json();
    conf = (await r2.json())[0] || {};
  } catch { return aviso("Não foi possível carregar", "Confira a internet e abra o link de novo."); }

  if (!pedido) return aviso("Pedido não encontrado", "Confira o link ou fale com a gente pelo WhatsApp.");
  if (pedido.cancelado) return aviso("Pedido cancelado", "Este pedido foi cancelado. Qualquer dúvida, fale com a gente pelo WhatsApp.");
  if (pedido.restante_pago) return aviso("Pedido pago", "Este pedido já está todo pago. Obrigada!");
  if (!conf.pix_chave) return aviso("Pagamento pelo WhatsApp", "Fale com a gente pelo WhatsApp para receber a chave Pix.");

  const total = Number(pedido.total), sinal = Number(pedido.sinal);
  const restante = Math.round((total - sinal) * 100) / 100;
  // Com o sinal pago, só sobra o restante. Sem o sinal, a cliente escolhe entre sinal e total.
  const opcoes = pedido.sinal_pago
    ? { restante: { valor: restante, rotulo: "Valor que falta pagar" } }
    : { sinal: { valor: sinal, rotulo: "Valor do sinal (50%)" }, total: { valor: total, rotulo: "Valor total do pedido" } };
  if (pedido.sinal_pago) $("opcoes").hidden = true;

  function mostrar(tipo) {
    const o = opcoes[tipo];
    const codigoPix = PixBR.copiaECola({ chave: conf.pix_chave, nome: conf.pix_nome, cidade: conf.pix_cidade, valor: o.valor, txid: codigo });
    $("rotulo-valor").textContent = o.rotulo;
    $("valor").textContent = brl(o.valor);
    $("qr").innerHTML = PixBR.qrSvg(codigoPix);
    $("copia").value = codigoPix;
    $("zap").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("Olá, Sweet Grace! Fiz o Pix de " + brl(o.valor) + " do pedido #" + codigo + ". Segue o comprovante:");
    document.querySelectorAll(".opcao").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tipo === tipo)));
  }
  $("opcoes").addEventListener("click", (e) => { const b = e.target.closest(".opcao"); if (b) mostrar(b.dataset.tipo); });
  $("copiar").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("copia").value); } catch { $("copia").select(); document.execCommand("copy"); }
    $("copiar").textContent = "Código copiado!";
    setTimeout(() => $("copiar").textContent = "Copiar código Pix", 2500);
  });

  $("titulo").textContent = "Pedido #" + codigo;
  const linhas = [["Total do pedido", brl(total)], ["Sinal (50%)", pedido.sinal_pago ? "pago" : brl(sinal)]];
  if (pedido.data_festa) linhas.unshift(["Data da festa", pedido.data_festa.split("-").reverse().join("/")]);
  linhas.forEach(([a, b]) => {
    const d = document.createElement("div");
    const x = document.createElement("span"); x.textContent = a;
    const y = document.createElement("b"); y.textContent = b; if (b === "pago") y.className = "pago";
    d.append(x, y); $("linhas").appendChild(d);
  });
  mostrar(pedido.sinal_pago ? "restante" : "sinal");
  $("carregando").hidden = true;
  $("conteudo").hidden = false;
})();
</script>
</body>
</html>
