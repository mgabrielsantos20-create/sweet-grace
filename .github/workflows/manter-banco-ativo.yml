# O Supabase grátis pausa o banco depois de uns dias sem uso.
# Esta tarefa lê o banco 3 vezes por dia para ele continuar ligado
# (desde 27/11/2026 o projeto está na organização grátis "Painel pessoal").
name: Manter o banco ativo

on:
  schedule:
    - cron: "17 2,10,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o cardápio no Supabase
        run: |
          URL="https://trlfspcbboqafosfdmoq.supabase.co"
          CHAVE="sb_publishable_boN8Ssyncz85x1XwjzH2kQ_EcVoHMir"
          for TABELA in sabores textos config; do
            curl -fsS "$URL/rest/v1/$TABELA?select=*&limit=1" -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE"
            echo
          done

      - name: Acordar também o banco do Painel do Gabriel
        run: |
          curl -fsS -X POST "https://nnasuwrrjosxqotztdqn.supabase.co/rest/v1/rpc/painel_ping" \
            -H "apikey: sb_publishable__Vq-OjJ12CYmI0EqAPCvPA_uTaUNtii" -H "Content-Type: application/json" -d '{}'
